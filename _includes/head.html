{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  // Resolve theme as early as possible so the link media attributes can apply without flash.
  (function() {
    var stored = localStorage.getItem('theme'); // 'light' | 'dark' | null (auto)
    if (stored === 'dark' || stored === 'light') {
      document.documentElement.setAttribute('data-theme', stored);
    } else {
      document.documentElement.setAttribute('data-theme',
        window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    }
  })();
</script>

<!-- Light theme: always loaded as the default. -->
<link rel="stylesheet" id="theme-light" href="{{ base_path }}/assets/css/main.css">
<!-- Dark theme: applies via prefers-color-scheme by default; JS overrides the media attribute on toggle. -->
<link rel="stylesheet" id="theme-dark" href="{{ base_path }}/assets/css/main-dark.css" media="(prefers-color-scheme: dark)">
<script>
  // If the user has an explicit override stored, force the dark sheet on/off accordingly.
  // Runs immediately after the links are parsed; no DOM-ready wait.
  (function() {
    var stored = localStorage.getItem('theme');
    if (stored !== 'dark' && stored !== 'light') return;
    var dark = document.getElementById('theme-dark');
    if (!dark) return;
    dark.media = (stored === 'dark') ? 'all' : 'not all';
  })();
</script>

<meta http-equiv="cleartype" content="on">
