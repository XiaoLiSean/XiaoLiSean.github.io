<!-- http://t.co/dKP3o1e -->
<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
  /* IMPORTANT: only block comments inside this script. Jekyll's compress_html
     layout strips newlines inside <script> tags; // line comments would swallow
     the rest of the script and prevent the IIFE from being invoked. */
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  (function() {
    var stored = localStorage.getItem('theme');
    var theme;
    if (stored === 'dark' || stored === 'light') {
      theme = stored;
    } else {
      var date = new Date();
      var lat = 40; /* hardcoded mid-latitude; covers the dominant US/EU/Asia audience */
      var dayOfYear = Math.floor((date - new Date(date.getFullYear(), 0, 0)) / 86400000);
      var decl = 23.45 * Math.sin((360 / 365) * (dayOfYear - 81) * Math.PI / 180);
      var cosHA = -Math.tan(lat * Math.PI / 180) * Math.tan(decl * Math.PI / 180);
      if (cosHA > 1) { theme = 'dark'; }
      else if (cosHA < -1) { theme = 'light'; }
      else {
        var halfDay = Math.acos(cosHA) * 180 / Math.PI / 15;
        var sunsetHour = 12 + halfDay;
        var sunriseHour = 12 - halfDay;
        var hr = date.getHours() + date.getMinutes() / 60;
        theme = (hr > sunsetHour || hr < sunriseHour) ? 'dark' : 'light';
      }
    }
    document.documentElement.setAttribute('data-theme', theme);
    document.documentElement.dataset.resolvedTheme = theme;
  })();
</script>

<!-- Single stylesheet. Dark-mode rules in _sass/_dark-theme.scss activate
